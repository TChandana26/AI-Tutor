<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08090f; --surface: #0f1118; --card: #141720; --border: #1e2333;
    --accent: #5b8dee; --accent-glow: rgba(91,141,238,0.25);
    --green: #29d9a3; --yellow: #f5c542; --pink: #e87d9e;
    --text: #dce3f0; --muted: #5a6480; --radius: 16px;
  }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
    height: 100vh; display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 300px 1fr;
    grid-template-areas: "sidebar header" "sidebar chat" "sidebar input";
    overflow: hidden;
  }
  .sidebar {
    grid-area: sidebar; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 24px 18px; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .brand-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), #9b59f5);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; box-shadow: 0 0 20px var(--accent-glow);
  }
  .brand-name { font-size: 1rem; font-weight: 600; }
  .brand-tag { font-size: 0.68rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  .sidebar-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .upload-zone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 20px; text-align: center; cursor: pointer;
    transition: all .25s; position: relative; overflow: hidden;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(91,141,238,0.06); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 1.8rem; margin-bottom: 8px; }
  .upload-text { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
  .upload-text span { color: var(--accent); font-weight: 500; }
  .pdf-info { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: none; }
  .pdf-info.visible { display: block; }
  .pdf-name { font-size: 0.82rem; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pdf-pages { font-size: 0.7rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  .pdf-status { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.72rem; color: var(--green); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  .suggestions { display: flex; flex-direction: column; gap: 6px; }
  .suggestion-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 0.75rem; color: var(--muted); text-align: left;
    cursor: pointer; transition: all .2s; font-family: 'DM Sans', sans-serif;
  }
  .suggestion-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(91,141,238,0.07); }
  .header {
    grid-area: header; padding: 20px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 0.95rem; font-weight: 600; }
  .header-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 0.72rem; padding: 6px 12px; border-radius: 8px;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all .2s;
  }
  .clear-btn:hover { border-color: var(--pink); color: var(--pink); }
  .chat { grid-area: chat; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 40px; }
  .empty-icon { font-size: 3rem; opacity: .4; }
  .empty-text { font-size: 0.85rem; color: var(--muted); line-height: 1.6; max-width: 300px; }
  .msg { display: flex; gap: 12px; animation: fadeUp .25s ease both; max-width: 75%; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-start; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
  .msg.user .msg-avatar { background: rgba(91,141,238,0.2); border: 1px solid rgba(91,141,238,0.3); }
  .msg.ai .msg-avatar { background: linear-gradient(135deg, var(--accent), #9b59f5); box-shadow: 0 0 12px var(--accent-glow); }
  .msg-bubble { padding: 12px 16px; border-radius: 14px; font-size: 0.83rem; line-height: 1.65; }
  .msg.user .msg-bubble { background: rgba(91,141,238,0.14); border: 1px solid rgba(91,141,238,0.22); border-bottom-right-radius: 4px; }
  .msg.ai .msg-bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 0.62rem; color: var(--muted); margin-top: 5px; font-family: 'DM Mono', monospace; }
  .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce .9s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{ transform:scale(1);opacity:.5; } 40%{ transform:scale(1.3);opacity:1; } }
  .input-area { grid-area: input; padding: 18px 28px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
  .input-wrap { flex: 1; }
  textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.84rem;
    resize: none; outline: none; line-height: 1.5; max-height: 120px; min-height: 50px;
    transition: border-color .2s;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .send-btn {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #9b59f5);
    border: none; color: #fff; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s; box-shadow: 0 4px 16px var(--accent-glow);
  }
  .send-btn:hover { transform: translateY(-2px); }
  .send-btn:active { transform: scale(0.95); }
  @media(max-width:680px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; grid-template-areas: "header" "sidebar" "chat" "input"; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">🎓</div>
    <div>
      <div class="brand-name">AI Tutor</div>
    </div>
  </div>

  <div class="sidebar-label">Upload your notes</div>
  <div class="upload-zone" id="upload-zone">
    <input type="file" accept=".pdf" id="file-input" onchange="handleUpload(this)"/>
    <div class="upload-icon">📎</div>
    <div class="upload-text">📂 Drop your PDF here or <span>browse</span></div>
  </div>

  <div class="pdf-info" id="pdf-info">
    <div class="pdf-name" id="pdf-name">—</div>
    <div class="pdf-pages" id="pdf-pages">—</div>
    <div class="pdf-status"><div class="dot"></div> Ready to answer questions</div>
  </div>

  <div class="sidebar-label">Suggested questions</div>
  <div class="suggestions">
    <button class="suggestion-btn" onclick="useSuggestion(this)">📌 Summarise this document</button>
    <button class="suggestion-btn" onclick="useSuggestion(this)">🔑 What are the key concepts?</button>
    <button class="suggestion-btn" onclick="useSuggestion(this)">❓ Create 3 quiz questions</button>
  </div>
</aside>

<header class="header">
  <div>
    <div class="header-title" id="header-title">📚 No document loaded</div>
    <div class="header-sub" id="header-sub">⬆️ Upload a PDF to start asking questions</div>
  </div>
  <button class="clear-btn" onclick="clearChat()">Clear chat</button>
</header>

<main class="chat" id="chat">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">📚</div>
    <div class="empty-text">📎 Upload your PDF notes above and start asking questions.<br>🤖 I'll answer only from your document!</div>
  </div>
</main>

<footer class="input-area">
  <div class="input-wrap">
    <textarea id="msg-input" placeholder="Ask a question about your PDF..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
      oninput="autoResize(this)"></textarea>
  </div>
  <button class="send-btn" onclick="sendMessage()">➤</button>
</footer>

<script>
  let sessionId = null;

  async function handleUpload(input) {
    const file = input.files[0];
    if (!file) return;

    document.getElementById('pdf-name').textContent  = '⏳ ' + file.name;
    document.getElementById('pdf-pages').textContent = '🔄 Uploading...';
    document.getElementById('pdf-info').classList.add('visible');

    const form = new FormData();
    form.append('pdf', file);

    try {
      const res  = await fetch('/upload', { method: 'POST', body: form });
      const data = await res.json();

      // ── Image-based PDF error ──────────────────────────
      if (res.status === 422 || (data.error && data.error.includes('IMAGE_BASED_PDF'))) {
        document.getElementById('pdf-name').textContent  = '❌ ' + file.name;
        document.getElementById('pdf-pages').textContent = 'Cannot process this file';
        document.getElementById('pdf-info').style.borderColor = 'rgba(249,112,112,0.4)';
        addMessage('ai',
          `🚫 **Oops! This PDF cannot be processed.**\n\n` +
          `📸 It looks like this is a **scanned or image-based PDF** — it contains pictures of text rather than actual text.\n\n` +
          `✅ **Please upload a text-based PDF instead.** These are PDFs you can select and copy text from.\n\n` +
          `💡 **Tip:** If you only have a scanned PDF, try using an online OCR tool like smallpdf.com to convert it first!`
        );
        sessionId = null;
        return;
      }

      // ── Success ───────────────────────────────────────
      sessionId = data.session_id;
      document.getElementById('pdf-name').textContent  = '📄 ' + data.filename;
      document.getElementById('pdf-pages').textContent = `📑 ${data.pages} pages · ✅ text extracted`;
      document.getElementById('pdf-info').style.borderColor = '';
      document.getElementById('header-title').textContent = '📖 ' + data.filename;
      document.getElementById('header-sub').textContent   = '✨ Ready · ask anything about this document';
      addMessage('ai', `🎉 I've read **${data.filename}** (${data.pages} pages)!\n\n🤔 Ask me anything about it — I'll answer only from your document.`);

    } catch (e) {
      document.getElementById('pdf-name').textContent  = '❌ Upload failed';
      document.getElementById('pdf-pages').textContent = 'Check Flask is running';
      addMessage('ai', '❌ **Upload failed.** Make sure Flask is running at localhost:5000 and try again.');
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const q = input.value.trim();
    if (!q || !sessionId) {
      if (!sessionId) addMessage('ai', '⚠️ Please upload a PDF first before asking questions!');
      return;
    }
    addMessage('user', q);
    input.value = ''; autoResize(input);

    const typingId = addTyping();
    try {
      const res  = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, question: q })
      });
      const data = await res.json();
      removeTyping(typingId);
      addMessage('ai', data.answer || data.error);
    } catch (e) {
      removeTyping(typingId);
      addMessage('ai', '❌ Could not reach Flask server. Is it running?');
    }
  }

  // ── Text to Speech ────────────────────────────────
  function speakText(text) {
    if (!window.speechSynthesis) { alert('TTS not supported in this browser!'); return; }
    window.speechSynthesis.cancel();
    const utt   = new SpeechSynthesisUtterance(text);
    utt.lang    = 'en-US';
    utt.rate    = 1.0;
    utt.pitch   = 1.0;
    window.speechSynthesis.speak(utt);
  }

  function stopSpeech() { window.speechSynthesis.cancel(); }

  function addMessage(role, text) {
    document.getElementById('empty-state')?.remove();
    const chat = document.getElementById('chat');
    const now  = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const ttsBtn = role === 'ai'
      ? `<button onclick="speakText(this.dataset.text)" data-text="${text.replace(/"/g, '&quot;')}"
            style="background:none;border:none;cursor:pointer;font-size:1rem;margin-left:6px;opacity:.6;vertical-align:middle;"
            title="🔊 Read aloud">🔊</button>
         <button onclick="stopSpeech()"
            style="background:none;border:none;cursor:pointer;font-size:1rem;opacity:.6;vertical-align:middle;"
            title="⏹ Stop">⏹</button>`
      : '';

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    msg.innerHTML = `
      <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div>
        <div class="msg-bubble">${text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>
        <div class="msg-time">${now} ${ttsBtn}</div>
      </div>`;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const chat = document.getElementById('chat');
    const id   = 'typing-' + Date.now();
    const el   = document.createElement('div');
    el.className = 'msg ai'; el.id = id;
    el.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(el); chat.scrollTop = chat.scrollHeight;
    return id;
  }

  function removeTyping(id) { document.getElementById(id)?.remove(); }

  function useSuggestion(btn) {
    document.getElementById('msg-input').value = btn.textContent.replace(/^[^\s]+\s/, '');
    sendMessage();
  }

  function clearChat() {
    document.getElementById('chat').innerHTML =
      `<div class="empty-state" id="empty-state"><div class="empty-icon">📚</div><div class="empty-text">Chat cleared. Ask another question!</div></div>`;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = 'var(--accent)'; });
  zone.addEventListener('dragleave', () => zone.style.borderColor = '');
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file?.type === 'application/pdf') {
      const dt = new DataTransfer(); dt.items.add(file);
      const inp = document.getElementById('file-input');
      inp.files = dt.files; handleUpload(inp);
    }
  });
</script>
</body>
</html>
